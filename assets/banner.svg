<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080d"/>
      <stop offset="40%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="line-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a658a" stop-opacity="0"/>
      <stop offset="60%" stop-color="#5f7f9f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#88b0d0" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="240" fill="url(#bg)"/>

  <!-- Rain strokes (TUYU rain aesthetic) -->
  <g stroke="url(#line-fade)" stroke-width="1" opacity="0.4">
    <line x1="60" y1="-20" x2="35" y2="90" />
    <line x1="140" y1="10" x2="115" y2="120" />
    <line x1="220" y1="-10" x2="195" y2="100" />
    <line x1="310" y1="20" x2="285" y2="130" />
    <line x1="420" y1="-30" x2="395" y2="80" />
    <line x1="500" y1="15" x2="475" y2="125" />
    <line x1="580" y1="-20" x2="555" y2="90" />
    <line x1="670" y1="30" x2="645" y2="140" />
    <line x1="750" y1="-10" x2="725" y2="100" />
    <line x1="830" y1="10" x2="805" y2="120" />
    <line x1="90" y1="110" x2="65" y2="220" />
    <line x1="180" y1="130" x2="155" y2="240" />
    <line x1="260" y1="100" x2="235" y2="210" />
    <line x1="370" y1="120" x2="345" y2="230" />
    <line x1="460" y1="140" x2="435" y2="250" />
    <line x1="540" y1="110" x2="515" y2="220" />
    <line x1="630" y1="130" x2="605" y2="240" />
    <line x1="710" y1="100" x2="685" y2="210" />
    <line x1="800" y1="120" x2="775" y2="230" />
    <line x1="880" y1="140" x2="855" y2="250" />
  </g>

  <!-- Left: Minimalist Umbrella Silhouette in Rain -->
  <g transform="translate(80, 50)" stroke="#6b87a8" stroke-width="1.2" fill="none" opacity="0.75">
    <!-- Umbrella canopy arc -->
    <path d="M 10 70 Q 55 10 100 70" stroke="#8aa5c4" stroke-width="1.4"/>
    <path d="M 10 70 Q 32 60 55 70 Q 77 60 100 70" stroke="#516c8a" stroke-width="1"/>
    <!-- Spindle & handle -->
    <line x1="55" y1="10" x2="55" y2="110" stroke="#8aa5c4"/>
    <path d="M 55 110 Q 55 125 45 125 Q 35 125 35 115" stroke="#8aa5c4"/>
    <!-- Rain droplets bouncing off umbrella -->
    <circle cx="25" cy="45" r="1" fill="#a8c5e6" opacity="0.6"/>
    <circle cx="85" cy="48" r="1" fill="#a8c5e6" opacity="0.6"/>
    <line x1="10" y1="70" x2="5" y2="85" stroke="#6b87a8" stroke-width="1" opacity="0.5"/>
    <line x1="100" y1="70" x2="105" y2="85" stroke="#6b87a8" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Center-Right Typography -->
  <g font-family="ui-monospace, 'SF Mono', 'Fira Code', 'PingFang SC', sans-serif">
    <!-- Japanese subtext -->
    <text x="230" y="72" fill="#556d8a" font-size="11" letter-spacing="4">ツユ · くらべられっ子 // KURABE RAREKKO AESTHETIC</text>
    
    <!-- Main Title -->
    <text x="230" y="115" fill="#d2d7df" font-size="24" font-weight="300" letter-spacing="8">SHENCHUCHU</text>
    
    <!-- Lyrics / Philosophy -->
    <text x="230" y="150" fill="#7a8d9e" font-size="12" font-style="italic" letter-spacing="1.5">「あの子より劣ってるのは 言われなくても解ってるよ」</text>
    
    <!-- Subtitle / Tagline -->
    <text x="230" y="182" fill="#42566e" font-size="11" letter-spacing="2">rain · isolation · low-level systems · no comparison</text>
  </g>

  <!-- Razor thin border -->
  <rect x="0.5" y="0.5" width="899" height="239" fill="none" stroke="#192333" stroke-width="1"/>
</svg>